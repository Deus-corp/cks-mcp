[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cks-mcp"
dynamic = ["version"]
description = "CKS MCP Server — Canonical Knowledge Structure for LLMs"
readme = "README.md"
authors = [{name = "Vladyslav Hruznov"}]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "cks-runtime>=1.40.0",
    "cks-core>=1.21.0",
    "requests>=2.0",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
fastembed = [
    "fastembed>=0.3",
]
gossip = [
    "aiohttp>=3.9",
]

[tool.setuptools.dynamic]
version = {attr = "cks_mcp._version.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    # Sync test methods inside a class that sits in a module with a
    # file-level `pytestmark = pytest.mark.asyncio` get a spurious
    # "marked with asyncio but is not async" warning from pytest-asyncio.
    # These methods are intentionally sync (pure-unit, no I/O); the
    # warning is cosmetic and does not affect correctness.
    "ignore::pytest.PytestWarning:pytest_asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cks-mcp = "cks_mcp.server:main_sync"
cks-critic-agent = "cks_mcp.critic_agent:main_sync"
cks-enrichment-agent = "cks_mcp.enrichment_agent:main_sync"

[tool.ruff.lint.per-file-ignores]
"src/cks_mcp/server.py" = ["BLE001"]
"src/cks_mcp/tools/*.py" = ["BLE001"]
"src/cks_mcp/resources.py" = ["BLE001"]
"src/cks_mcp/provenance.py" = ["BLE001"]