[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cks-mcp"
version = "1.10.5"
description = "CKS MCP Server — Canonical Knowledge Structure for LLMs"
readme = "README.md"
authors = [{name = "Vladyslav Hruznov"}]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "cks-runtime>=1.20.0",
    "cks-core>=1.12.0",
    "requests>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cks-mcp = "cks_mcp.server:main"

[tool.ruff.lint.per-file-ignores]
"src/cks_mcp/server.py" = ["BLE001"]
"src/cks_mcp/tools/*.py" = ["BLE001"]
"src/cks_mcp/resources.py" = ["BLE001"]
"src/cks_mcp/provenance.py" = ["BLE001"]